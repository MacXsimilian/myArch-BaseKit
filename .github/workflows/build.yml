name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build Linux x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # Standard-library-only module: there is no go.sum to cache.
          cache: false
      - name: Build and package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            bash scripts/validate-release.sh "$GITHUB_REF_NAME"
            make package VERSION="$GITHUB_REF_NAME"
          else
            make package
          fi
      - name: Verify the packaged download
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          mkdir unpacked
          tar -xzf myarch-buildkit-linux-x86_64.tar.gz -C unpacked
          cd unpacked
          sha256sum -c SHA256SUMS
          ./myarch-buildkit --version
          ./myarch-buildkit --help
          ./myarch-buildkit plan
      - uses: actions/upload-artifact@v7
        with:
          name: myarch-buildkit-linux-x86_64
          path: |
            dist/myarch-buildkit-linux-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', stable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Static analysis and tests
        run: |
          make vet
          go test -race ./...
      - name: Check formatting
        if: matrix.go == 'stable'
        run: make fmt-check
      - name: Test privileged file operations in temporary directories
        if: matrix.go == 'stable'
        run: |
          go test -c -o "$RUNNER_TEMP/privileged.test" ./cmd/myarch-buildkit
          sudo "$RUNNER_TEMP/privileged.test" -test.v -test.run '^(TestPrivilegedWritesJournalOriginalAndRestoreExplicitly|TestPrivilegedRestoreProtectsLaterEdits|TestPrivilegedWriterRejectsSymlinkAndWritableAncestor|TestSystemRestoreNeverTrustsCallerBackupPath|TestLegacySystemRestoreKeepsRemovedSettingsRestoreOnly)$'

  lint:
    name: Lint automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check workflows and release scripts
        run: |
          actionlint -color
          shellcheck scripts/*.sh

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: myarch-buildkit-linux-x86_64
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" \
            myarch-buildkit-linux-x86_64.tar.gz SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
