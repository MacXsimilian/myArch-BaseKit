name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # Standard-library-only module: there is no go.sum to cache.
          cache: false
      - name: Build and package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # Validate external ref text before passing it through Make variables.
            bash scripts/validate-release.sh "$GITHUB_REF_NAME"
            make package VERSION="$GITHUB_REF_NAME"
          else
            make package
          fi
      - name: Verify the packaged download
        run: make package-check
      - name: Record download checksum
        run: |
          {
            echo '### Linux x86-64 package'
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myarch-buildkit-linux-x86_64
          path: |
            dist/myarch-buildkit-linux-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

  test:
    name: Test Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Static analysis and tests
        env:
          MYARCH_REQUIRE_ROOT_OWNED_FIXTURES: '1'
        run: |
          make vet
          make test-race
      - name: Check formatting
        if: matrix.go == 'stable'
        run: make fmt-check
      - name: Test privileged file operations in temporary directories
        if: matrix.go == 'stable'
        run: |
          go test -c -o "$RUNNER_TEMP/privileged.test" ./cmd/myarch-buildkit
          sudo "$RUNNER_TEMP/privileged.test" -test.v -test.run '^(TestPrivileged.*|TestSystemRestoreNeverTrustsCallerBackupPath|TestLegacySystemRestoreKeepsRemovedSettingsRestoreOnly)$'

  lint:
    name: Lint automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check workflows and release scripts
        run: make lint
      - name: Test packaging and publication safeguards offline
        run: make automation-test

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myarch-buildkit-linux-x86_64
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          bash scripts/publish-release.sh
